<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Time Like & Dislike</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6f9;
      }

      .box {
        text-align: center;
        background: white;
        padding: 30px;
        width: 28rem;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-bottom: 20px;
      }

      button {
        padding: 10px 20px;
        border: none;
        margin: 10px;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      .like {
        background: #4caf50;
      }

      .like:hover {
        background: #43a047;
      }

      .dislike {
        background: #f44336;
      }

      .dislike:hover {
        background: #e53935;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h1>Total Likes = <span id="number">No Like Yet</span></h1>

      <button id="likeButton" class="like">👍 Like</button>
      <button id="dislikeButton" class="dislike">👎 Dislike</button>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
